[project]
name = "learn-claude-agent-sdk"
version = "0.1.0"
description = "Build Your Own Claude Code Workshop - Learn AI agent fundamentals step by step"
authors = [{ name = "Param Harrison", email = "param@learnwithparam.com" }]
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
